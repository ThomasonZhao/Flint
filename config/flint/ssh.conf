# Private host definitions and forwarding opt-ins take precedence.
Include ~/.config/flint/local/ssh.conf

# Each OpenSSH invocation can find the current agent, even from an old job.
Match exec "test -S ~/.local/state/flint/ssh-agent"
    IdentityAgent ~/.local/state/flint/ssh-agent
Host *
    ServerAliveInterval 60
    ServerAliveCountMax 3
