# Private file: ~/.config/flint/local/ssh.conf
# Forward only to trusted servers. No private keys belong on those servers.
# Host experiments
#     HostName server.example.com
#     User yourname
#     ForwardAgent yes
#
# macOS-only local key settings:
# Host github.com
#     AddKeysToAgent yes
#     IgnoreUnknown UseKeychain
#     UseKeychain yes
#     IdentityFile ~/.ssh/your-key
